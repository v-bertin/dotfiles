font_family      0xProto
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 20.0

tab_bar_edge top
# TODO : tab_bar_style
tab_bar_style fade
tab_title_template "{title.split(':')[-1].strip().split('/')[-1]}"
# Colors from Kanagawa Dragon theme
# See https://github.com/rebelot/kanagawa.nvim
tab_bar_background #181616

# color of the border around an active window
active_border_color #737c73

background_opacity 0.5
background_blur 0

# START RESERVED SHORTCUTS
# ctrl+c - SIGINT
# ctrl+d - EOF
# ctrl+r - vim redo
# END

map ctrl+1 change_font_size all +2.0
map ctrl+minus change_font_size all -2.0

map ctrl+e edit_config_file
map ctrl+u load_config_file

map ctrl+shift+t new_tab_with_cwd !neighbor

map alt+right next_tab
map alt+l next_tab
map alt+left previous_tab
map alt+h previous_tab

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map alt+shift+right move_tab_forward
# map alt+shift+l move_tab_forward
map alt+shift+left move_tab_backward
# map alt+shit+h move_tab_backward

# TODO : improve windows search with fzf
# map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-mouse --exact -i --tac
map ctrl+shift+f launch --allow-remote-control kitty +kitten kitten/search/search.py @active-kitty-window-id

# Let's see how it goes ...
map ctrl+shift+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# splits layout
enabled_layouts splits

# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map ctrl+shift+h launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map ctrl+shift+v launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
map ctrl+shift+n launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map ctrl+shift+r layout_action rotate

# Move the active window in the indicated direction
map ctrl+shift+up move_window up
map ctrl+shift+left move_window left
map ctrl+shift+right move_window right
map ctrl+shift+down move_window down

# Move the active window to the indicated screen edge
# map ctrl+shift+up layout_action move_to_screen_edge top
# map ctrl+shift+left layout_action move_to_screen_edge left
# map ctrl+shift+right layout_action move_to_screen_edge right
# map ctrl+shift+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map shift+left neighboring_window left
map shift+right neighboring_window right
map shift+up neighboring_window up
map shift+down neighboring_window down
